<div class="cart-container">
  <h2>Your Cart</h2>
  <div class="upload-section">
    <h3>Upload Prescription</h3>
    <input type="file" (change)="onFileSelected($event)" accept="image/*,.pdf" />
    <button (click)="onUpload()" [disabled]="!selectedFile">Upload</button>
  </div>
  <div *if="uploadedFileName">
    <p>Uploaded Prescription Name: {{ uploadedFileName }}</p>
  </div>
</div>
